    <section class="section">
      <div class="wrap masonry">
        <figure class="quote feature">
          <blockquote>It was a pleasure to work with Miss Tea Maven. Not only was she incredibly flexible when coordinating with our tournament head, she was open to new ideas as they came up over the course of the training and bootcamp. The coordination and back and forth communication was detailed and courteous, as she was available for reference and planning months ahead of time. Maven was always as excited as the participants were, from start to finish. She was available for private sessions among individuals as well as leading a full boot camp with over 100 participants. Each of the private sessions were unique based on each client&rsquo;s requests. Multiple people were impressed with her humility and knowledge. It wasn&rsquo;t about just bringing information from her team, but about taking what she observed from the leagues in our area and taking them to the next step. I would recommend her as a training coach for any league in a heartbeat.</blockquote>
          <figcaption><div><cite>Athena Latina</cite><span class="src">Boom Town Derby Dames</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>I was fortunate enough to work with Maven in a group setting and one-on-one. When coaching in a group she makes sure that everyone understands drills, but she also makes sure every single person steps out of their comfort zone. Being one-on-one with her she taught me the importance of not only physical strength but mental as well. 10/10 recommend.</blockquote>
          <figcaption><div><cite>Gotham</cite><span class="src">Saskatoon Roller Derby</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>At the time Maven came up I had only been skating for less than a year, a total freshie. Maven did an amazing job blowing our minds watching her do what we all will eventually be able to do if we just put in the hard work and dedication. My mind was blown when I watched her do a jumping one footed hockey stop! One of the best things about her boot camp is she broke the moves she taught down into simple steps, and even though I couldn&rsquo;t perform them I understood what I need to do in the future. 100% recommend her as a training coach!</blockquote>
          <figcaption><div><cite>Megan Moody</cite><span class="src">Boom Town Derby Dames</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>Maven is an amazing coach!! She has helped myself and my team improve drastically in all aspects of derby, from the basics to game strategy and execution. She is excellent at pinpointing areas needing work on both a team and individual level and knows exactly how to help! She is super fun and the sweetest of the sweet! We love Maven!!!</blockquote>
          <figcaption><div><cite>Bones</cite><span class="src">Dirty Jersey Roller Derby</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>Maven breaks down her instructions into simple steps, can demonstrate skills with ease, and is able to teach people of different abilities at the same time without sacrificing the flow of the class. I always learn a lot from her classes at RollerCon, and because she is so good at summarizing things at the end, I remember them easily.</blockquote>
          <figcaption><div><cite>Knockems Raezor</cite><span class="src">Air Raid Roller Derby</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>By far my favorite grouping of jammer classes at RollerCon 2017. She has solid organized classes, taking time to explain and answer questions. Can&rsquo;t wait to see what she has planned for this year!</blockquote>
          <figcaption><div><cite>Sugar Rush</cite><span class="src">Dominion Derby Girls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>I really appreciated the personal attention. Maven watched me skate in the tournament and then provided me with feedback and coaching based on what she saw in my game play. The large group coaching was fun and challenging. She was a very enthusiastic coach who was obviously keen to share her passion and energy with the group.</blockquote>
          <figcaption><div><cite>Honey Badger</cite><span class="src">Yukon Roller Girls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>I think the Maven practice was excellent. I&rsquo;ve done several training camps like that, and I think this was the best one by far. I really liked her theory on the jammer breaking through the wall. I am sore today, like really sore, and I haven&rsquo;t been this sore in a good while. I am grateful for that, it means we worked hard. We ran out of time, and that&rsquo;s a bummer because I&rsquo;m sure there&rsquo;s more we could have learned. I hope she can come back and finish the lessons!</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
        <figure class="quote feature">
          <blockquote>I really appreciate the way she broke things down. Her practice flowed from beginning with the off skates footwork, to doing the same stuff on skates, and then applying it to the specific derby skills. There was great momentum and I felt like I was getting slightly better as the practice went on, rather than feeling overwhelmed.</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>It felt like we got to see and try a bunch of new footwork moves for a short time. It was less drilling them down and more learning them enough to drill them down after, which meant it covered a lot. She was well spoken and great with time. Everything was timed and switched out well even with 90 people so it didn&rsquo;t feel like we were waiting around at all.</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">RollerCon</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>Maven is an amazing jammer and it was cool to have her break down a couple of the skills she uses. I particularly liked the mohawk, toe pick type hop, into running away. It was fun to do, and showing the breakdown of it made it so obvious why it works. I also liked the emphasis on using our levels.</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">RollerCon</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>I thought it was really helpful to have the mechanics of jamming broken down (where to hit a wall, full body juking, narrow plows to change direction), because those things are not always spelled out at practices. I liked that we did some of those things off skates, too.</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>The practice was really great. She did a good job of breaking things down and pushing us. I also enjoyed the cardio at the beginning. I learned so much about jammer strategy. It was great!!</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>From a newb perspective, I thought a lot of the base moves were really important for me to build correct skills on. The instructions for footwork, never losing momentum, juking, and prying blockers was awesome. Maybe one day I&rsquo;ll try a tornado too!! Can&rsquo;t wait for the next practice!</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
        <figure class="quote">
          <blockquote>I liked Maven&rsquo;s jammer class. She spoke about some good stuff on the line but we didn&rsquo;t have time to try it. Please invite her back!</blockquote>
          <figcaption><div><cite>Skater</cite><span class="src">Garden State Rollergirls</span></div></figcaption>
        </figure>
      </div>
